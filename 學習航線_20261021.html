learn:function(){if(S.subj=="english")return '<div class="map-intro"><div><h2>英語概念學習</h2><p class="mute">影音、字幕與單字卡，依自己的步調學習。</p></div></div><div class="card"><span class="pill green">Daily routines · 聽力與句型</span><div class="media-frame" style="margin-top:.8rem"><div class="media-screen"><span class="pill orange">影音教材示意</span><h3 style="margin-top:.5rem">日常作息對話</h3><p class="mute">影片長度 3 分 40 秒 · 可搭配字幕與單字卡</p><button class="media-play" data-act="play-video">'+(S.videoPlaying?'Ⅱ':'▶')+'</button></div></div><h3 style="margin-top:1rem">學習重點</h3><p>先聽懂對話大意，再留意日常作息詞彙與 he / she 動詞變化。</p><div class="eg"><b>單字卡</b><p>'+EWORDS.join(' · ')+'</p></div><details style="margin-top:.7rem"><summary>查看學習例句</summary><p>He gets dressed at seven. She has breakfast before school.</p></details><p class="map-note">此學習區提供影音、字幕、單字卡與例句，不安排測驗；診斷與學習後評量另行進行。</p><div style="margin-top:1rem"><button class="btn" data-go="practice">完成學習，前往後測</button></div></div>';var parent=MAPNODES[0],child=parent.children[S.learnChild]||parent.children[0];var lessonList=parent.children.map(function(c,i){return '<button class="lesson-item" data-learn-child="'+i+'" aria-current="'+(i==S.learnChild?'step':'false')+'">'+(i+1)+'．'+c.name+'<small>概念內容</small></button>'}).join('');return '<div class="map-intro"><div><h2>概念學習</h2><p class="mute">先看懂概念，再依自己的步調閱讀與練習例題。</p></div><span class="pill green">第 '+parent.book+' 冊 · 單元 '+parent.unit+' · '+parent.name+'</span></div><div class="learn-layout"><aside class="card lesson-nav"><h3>本單元學習內容</h3><div class="lesson-course">'+parent.name+'</div>'+lessonList+'<p class="learn-nav-foot">學習順序可依診斷結果調整。此處不放測驗；起點診斷與學習後的後測評量分開進行。</p></aside><section class="learn-main"><div class="card"><div class="dash-title"><div><span class="pill">目前知識點</span><h3 style="margin-top:.45rem">'+child.name+'</h3></div><span class="mute">影音與重點教材</span></div><div class="media-frame"><div class="media-screen"><span class="pill orange">影音教材示意</span><h3 style="margin-top:.5rem">'+child.name+'｜概念說明</h3><p class="mute">影片長度 4 分 20 秒 · 建議看完後閱讀重點與例題</p><button class="media-play" aria-label="播放示意影片" data-act="play-video">'+(S.videoPlaying?'Ⅱ':'▶')+'</button></div></div><div class="media-meta"><span class="pill green">'+(S.videoPlaying?'播放中':'尚未播放')+'</span><span class="pill">字幕：可開啟</span><span class="pill orange">觀看進度：示意 0:00 / 4:20</span></div><div class="learn-progress" aria-label="影音觀看進度示意"><span></span></div></div><div class="learn-materials"><div class="card learn-section"><h3>本節學習重點</h3><div class="learn-goal"><span class="pill">認識概念</span><span class="pill green">理解表示方式</span></div><p>用自己的話說明「'+child.name+'」的意思，並能指出它和本單元其他概念的關係。</p><ul class="learn-list"><li>先觀看短影音，抓住核心概念。</li><li>閱讀重點摘要，對照課本或講義。</li><li>看完例題後，試著說明每一步的想法。</li></ul></div><div class="card learn-section"><h3>例題與學習材料</h3><p class="mute">教材可依知識點提供影片、圖解、課本頁面與範例。</p><div class="eg"><b>例題示意</b><p>把概念放進一個簡單情境中，先看解題步驟，再試著自己說明為什麼這樣做。</p></div><details style="margin-top:.65rem"><summary>查看完整例題說明</summary><p>先找出題目中的已知條件，再選擇適合的概念表示；完成後，用自己的話說明每一步的理由。</p></details><p class="learn-nav-foot">學習行為紀錄：影音播放／暫停、觀看進度、字幕使用、教材開啟與停留時間。</p></div></div><div class="card"><div class="dash-title"><div><h3>完成概念學習</h3><p class="mute">確認已看過影音與學習材料，再前往獨立的後測評量。</p></div><button class="btn" data-go="practice">完成學習，前往後測</button></div></div></section></div>'},
course:function(){if(S.subj=="english")return '<h2>英語學習地圖</h2><p class="mute">每天練一點：單字、聽力、句型和閱讀。</p><div class="grid" style="margin-top:1rem">'+EN.nodes.map(function(x,i){return '<div class="card"><span class="pill '+(i%2?'green':'')+'">學習站 '+(i+1)+'</span><h3 style="margin-top:.6rem">'+x[0]+'</h3><p class="mute">目前練習表現：'+x[1]+'</p><div class="eg">'+(i==0?EWORDS.join(" · "): ["聽懂日常作息對話","分辨 he / she 的動詞變化","讀懂簡短生活情境"][Math.max(0,i-1)])+'</div><button class="btn ghost" style="margin-top:.7rem" data-go="practice">前往練習</button></div>'}).join('')+'</div><div class="card" style="margin-top:1rem"><h3>今日學習建議</h3><p>'+EN.resource+'</p></div>';var focus=MAPNODES,cur=focus[0],next=focus[1],later=focus[2];function nodeCard(n,label,state){if(!n)return '';var kids=n.children.map(function(k){return '<li>'+k.name+'</li>'}).join('');return '<div class="tree-node '+state+'"><span class="node-label">'+label+'｜第 '+parseInt(n.book,10)+' 冊 · 第 '+parseInt(n.unit,10)+' 單元</span><b>'+n.name+'</b>'+ (kids?'<details><summary>查看知識點（'+n.children.length+'）</summary><ul>'+kids+'</ul></details>':'')+'</div>'}return '<div class="map-intro"><div><h2>數學學習地圖</h2><p class="mute">查看知識點之間的前後關係，掌握上一個、目前與本學期接續的學習內容。</p></div><div class="map-legend"><span class="pill green">上一個學習</span><span class="pill">目前學習</span><span class="pill orange">本學期接續</span></div></div><div class="map-layout"><div class="card"><div class="dash-title"><div><h3>知識點學習路徑</h3><p class="mute">國小數學學習內容</p></div><span class="pill">學年 115 · 康軒</span></div><div class="tree-scroll"><div class="tree" aria-label="數學知識點前後關係"><div class="tree-row">'+nodeCard(cur,'目前學習','current')+'<span class="tree-arrow">→</span>'+nodeCard(next,'本學期接續','future')+'<span class="tree-arrow">→</span>'+nodeCard(later,'本學期接續','future')+'</div></div><div class="tree-down">↓</div><div class="sem-grid"><div class="semester"><h3>上一個學習</h3><div class="tree-node past"><span class="node-label">前置概念</span><b>整數乘法與除法</b><small>前置概念關係待確認</small></div></div><div class="semester"><h3>目前學習</h3>'+nodeCard(cur,'本學期進度','current')+'</div><div class="semester"><h3>本學期接續</h3>'+nodeCard(next,'後續課次','future')+nodeCard(later,'後續單元','future')+'</div></div></div><div class="map-note">學習順序依課程架構安排；前置概念關係仍待確認。節點顏色代表學習進度，不代表能力等級。</div><div class="tabs" role="tablist" aria-label="目前單元知識點">'+cur.children.map(function(x,i){return '<button role="tab" data-map-child="'+i+'" aria-selected="'+(S.mapChild==i)+'">'+x.name+'</button>'}).join('')+'</div><div role="tabpanel"><h3>'+(cur.children[S.mapChild]||cur.children[0]||{}).name+'</h3><p class="mute">本單元的核心概念與延伸知識點。</p><button class="btn" style="margin-top:.8rem" data-go="learn">開始概念學習</button></div></div><aside class="map-sidebar"><div class="card"><h3>我的學習狀態</h3><p class="mute">目前單元的示範進度</p><div class="map-progress"><div><span>上一個學習</span><b>可回顧</b></div><div><span>目前學習</span><b>進行中</b></div><div><span>本學期接續</span><b>尚未開始</b></div></div></div><div class="card"><h3>今日建議</h3><p class="mute">完成目前知識點後，再依練習結果決定是否回顧前置概念或繼續下一課。</p><button class="btn ghost" style="margin-top:.6rem" data-go="learn">開始概念學習</button></div></aside></div>'},

for(var i=0;i<S.hints;i++)h+='<p class="hint">提示 '+(i+1)+'：'+q.h[i]+'</p>';
h+='<div class="acts">';

return '<div class="grid"><div class="card"><h2>單元後測評量</h2><p class="mute">完成概念學習後，檢視能否獨立運用本單元知識。</p>'+h+'</div></div></div><div style="margin-top:1rem">'+book()+'</div>'},

growth:function(){var isEn=S.subj=="english";var topics=isEn?[["Vocabulary",75,"持續練習"],["Listening",62,"建議回聽"],["Sentence patterns",48,"優先補強"],["Reading",68,"穩定累積"]]:[["因數與公因數",85,"大致穩定"],["倍數與公倍數",70,"可再複習"],["最大公因數與最小公倍數",60,"持續練習"],["生活應用題",48,"優先補強"]];return '<div class="report-head"><div><span class="pill green">個人學習報表</span><h2 style="margin-top:.4rem">我的成長</h2><p class="mute">回顧最近的學習投入、知識點表現與下一步。</p></div><div class="report-filters"><button class="filter active">近 7 天</button><button class="filter">近 30 天</button><button class="filter">本學期</button></div></div><div class="report-kpis"><div class="card"><small>學習次數</small><b>4 次</b><span class="mute">近 7 天</span></div><div class="card"><small>學習時間</small><b>80 分鐘</b><span class="mute">分散於 4 天</span></div><div class="card"><small>完成知識點</small><b>2 個</b><span class="mute">本週新增 1 個</span></div><div class="card"><small>待回顧</small><b>1 項</b><span class="mute">建議安排短回顧</span></div></div><div class="report-grid"><div class="card"><div class="dash-title"><div><h3>知識點掌握概況</h3><p class="mute">依近期診斷、後測與練習資料整理</p></div><span class="pill">'+(isEn?"英語":"數學")+'</span></div>'+bars(topics.map(function(x){return[x[0],x[1]]}))+'<table class="report-table"><thead><tr><th>知識點</th><th>近期表現</th><th>建議</th></tr></thead><tbody>'+topics.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'%</td><td>'+x[2]+'</td></tr>'}).join('')+'</tbody></table></div><div class="card"><h3>近期學習表現</h3><p class="mute">呈現練習表現的變化；不等同正式成績。</p><div class="cv"><canvas id="c1" role="img" aria-label="近期學習表現變化圖"></canvas></div><h3 style="margin-top:1rem">學習節奏</h3><div class="cv"><canvas id="c2" role="img" aria-label="本週學習時間圖"></canvas></div></div></div><div class="report-grid"><div class="card"><h3>近期學習紀錄</h3><ul class="clean"><li class="m"><span>週一 · 完成概念學習</span><span class="tag fix">因數</span></li><li class="m"><span>週三 · 完成後測評量</span><span class="tag fix">8 / 10 題</span></li><li class="m"><span>週五 · 訂正並查看解析</span><span class="tag open">應用題</span></li><li class="m"><span>週日 · 延後回顧</span><span class="tag open">待完成</span></li></ul></div><div class="card"><h3>下一步建議</h3><p class="eg">先回看「'+topics[3][0]+'」的概念例題，隔天用不同題目再試一次。</p><div class="acts" style="margin-top:.7rem"><button class="btn" data-go="learn">繼續概念學習</button><button class="btn ghost" data-go="errors">查看待回顧</button></div></div></div><p class="note" style="margin-top:1rem">示範報表：目前數值為原型資料。正式報表應標示統計期間、資料來源與題數；作答表現是學習線索，不直接等同能力或努力程度。</p>'},

function draw(){CH.forEach(function(c){c.destroy()});CH=[];if(!window.Chart||!(S.view==="home"||S.view==="growth"))return;var cs=getComputedStyle(document.documentElement),g=function(n){return cs.getPropertyValue(n).trim()};Chart.defaults.color=g("--mute");Chart.defaults.borderColor=g("--line");Chart.defaults.font.family='"Noto Sans TC",sans-serif';var o={responsive:true,maintainAspectRatio:false};var curveData=S.subj==="english"?[48,53,56,60,59,64,66]:[52,58,62,65,70,72,S.score];if($("#c1"))CH.push(new Chart($("#c1"),{type:"line",data:{labels:["10/15","10/16","10/17","10/18","10/19","10/20","10/21"],datasets:[{label:"學習表現（示意）",data:curveData,borderColor:g("--sea"),backgroundColor:g("--soft"),fill:true,tension:.3,pointRadius:4,pointHoverRadius:6}]},options:Object.assign({scales:{y:{min:30,max:100}},plugins:{legend:{display:false}}},o)}));if($("#c2"))CH.push(new Chart($("#c2"),{type:"bar",data:{labels:["一","二","三","四","五","六","日"],datasets:[{label:"影音與教材",data:[15,20,25,10,15,30,20],backgroundColor:g("--sea")},{label:"練習與回顧",data:[10,15,10,5,10,20,10],backgroundColor:g("--sun")}]},options:Object.assign({scales:{x:{stacked:true},y:{stacked:true}}},o)}));if($("#c3"))CH.push(new Chart($("#c3"),{type:"bar",data:{labels:["因數","公因數","短除法","應用題"],datasets:[{label:"首次答對",data:[80,65,50,40],backgroundColor:g("--mute")},{label:"訂正後",data:[100,90,85,75],backgroundColor:g("--sea")}]},options:Object.assign({scales:{y:{max:100}},plugins:{legend:{position:"bottom"}}},o)}))}
